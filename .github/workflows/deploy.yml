name: Build and deploy to AWS

# Every push to main builds the Angular app and publishes it to the
# S3 bucket in Mumbai (ap-south-1). Can also be started by hand from the
# Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the job can sign in to AWS with GitHub's OIDC token
# (no AWS access keys are stored in GitHub).
permissions:
  id-token: write
  contents: read

# If two pushes land close together, only the newest one deploys.
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::975050177682:role/github-actions-propery-eval-deploy
  S3_BUCKET: angular-app-mumbai-4p5-2026
  BUILD_DIR: dist/propery-eval/browser
  # Fill in once the CloudFront distribution exists (e.g. E1ABCDEF2GHIJK).
  # While empty, the cache-invalidation step is skipped.
  CLOUDFRONT_DISTRIBUTION_ID: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed JS/CSS bundles and assets: cached by browsers for a day.
      # index.html is uploaded last and never cached, so visitors always
      # pick up the newest bundles right after a deploy.
      - name: Upload files to S3
        run: |
          aws s3 sync "$BUILD_DIR" "s3://$S3_BUCKET" \
            --exclude "index.html" \
            --cache-control "public,max-age=86400"
          aws s3 cp "$BUILD_DIR/index.html" "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Remove files from old builds
        run: aws s3 sync "$BUILD_DIR" "s3://$S3_BUCKET" --delete --size-only

      - name: Clear CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Summary
        run: |
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- S3 website: http://$S3_BUCKET.s3-website.$AWS_REGION.amazonaws.com" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "- CloudFront cache cleared for $CLOUDFRONT_DISTRIBUTION_ID" >> "$GITHUB_STEP_SUMMARY"
          fi
